name: compile check and push

on:
  push:
    branches-ignore:
      - 'ga-ignore-**'
  pull_request:
    branches-ignore:
      - 'ga-ignore-**'

env:
  MIRROR_URL: 'git@github.com:EpitechPGE3-2025/G-CNA-500-NAN-5-1-neuralnetwork-6'
  EXECUTABLES: 'my_torch_analyzer'

jobs:
  check_epitech_coding_style:
    if: github.repository != 'EpitechPGE3-2025/G-CNA-500-NAN-5-1-neuralnetwork-6'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/epitech/coding-style-checker:latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Check the coding style"
        run: |
          check.sh "$(pwd)/zappy_server_src" "$(pwd)"
          tmpfile=$(mktemp)

          echo "0" > "$tmpfile"
          error_count=0
          while read -r line; do
            file=$(echo "$line" | cut -d':' -f1 | cut -d'/' -f 2-)
            nbline=$(echo "$line" | cut -d':' -f2)
            title=$(echo "$line" | cut -d':' -f3)" coding style error"
            code=$(echo "$line" | cut -d':' -f4)
            echo "::error title=$title,file=$file,line=$nbline,col=0::$code"
            error_count=$((error_count + 1))
          done < coding-style-reports.log

          if [ "$error_count" -gt 1 ]; then
            echo "More than one coding style error detected. Failing CI."
            rm "$tmpfile"
            exit 1
          fi
          rm "$tmpfile"
  check_program_compilation:
    needs: check_epitech_coding_style
    runs-on: ubuntu-latest
    steps:
        -  name: "Checkout"
           uses: actions/checkout@v4
        - name: "Set up Python"
          uses: actions/setup-python@v4
          with:
                python-version: '3.11'
        - name: "Install dependencies (if any)"
          run: |
            if [ -f requirements.txt ]; then
                python -m pip install --upgrade pip
                pip install -r requirements.txt
            fi
        - name: "Syntax check (compile .py files)"
          run: |
            py_files=$(git ls-files '*.py' | tr '\n' ' ')
            if [ -n "$py_files" ]; then
                python -m py_compile $py_files
            else
                echo "No python files to check"
            fi
        - name: "Run tests (if present)"
          run: |
            if [ -d tests ] || git ls-files '*_test.py' | grep -q .; then
                pip install pytest
                pytest -q
            else
                echo "No tests found; skipping"
            fi
  push_to_mirror:
    needs: check_program_compilation
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Mirroring"
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url:
            ${{ env.MIRROR_URL }}
          ssh_private_key:
            ${{ secrets.GIT_SSH_PRIVATE_KEY }}